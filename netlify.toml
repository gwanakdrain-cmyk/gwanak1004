[build]
  publish = "."

[[redirects]]
  from = "https://www.gwanak1004.co.kr/*"
  to   = "https://gwanak1004.co.kr/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "/gwanak-final-index"
  to     = "/gwanak-final-index/"
  status = 301

[[redirects]]
  from   = "/gwanak-naver-index"
  to     = "/gwanak-naver-index/"
  status = 301

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/gwanak-final-index/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/gwanak-naver-index/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"
